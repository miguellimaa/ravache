name: Node.js e Docker

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do Node.js
        run: npm test
      - name: Construir imagem Docker
        run: docker build -t ravache-node .
      - name: Iniciar container
        run: docker run -d --name ravache-app -p 3000:3000 ravache-node
      - name: Validar resposta HTTP
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:3000 | grep -q 'Hello World!'; then
              echo 'Aplicacao funcionando!'
              exit 0
            fi
            sleep 2
          done
          docker logs ravache-app
          exit 1
      - name: Encerrar container
        if: always()
        run: docker rm -f ravache-app || true
